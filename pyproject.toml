[project]
name = "apipartnerhub"
version = "1.0.0"
description = "Partner-facing advertising data API platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "APIPartnerHub Solutions Engineering" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "SQLAlchemy>=2.0.30,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "redis>=5.0,<7.0",
    "PyJWT>=2.9,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-cov>=5.0,<8.0",
    "httpx>=0.27,<1.0",
    "fakeredis>=2.23,<3.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "openapi-spec-validator>=0.7,<1.0",
    "PyYAML>=6.0,<7.0",
    "matplotlib>=3.9,<4.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
exclude = ["bench*", "sdks*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "scripts", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["tests/", "sdks/", "bench/", "examples/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
