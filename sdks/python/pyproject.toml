[project]
name = "apipartnerhub"
version = "1.0.0"
description = "Python SDK for the APIPartnerHub partner advertising data API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27,<1.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apipartnerhub*"]

[tool.setuptools.package-data]
apipartnerhub = ["py.typed"]
