name: apipartnerhub

services:
  postgres:
    image: postgres:16
    container_name: apipartnerhub-postgres
    environment:
      POSTGRES_USER: apph
      POSTGRES_PASSWORD: apph
      POSTGRES_DB: apph
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apph -d apph"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7
    container_name: apipartnerhub-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
    name: apipartnerhub_postgres_data
  redis_data:
    name: apipartnerhub_redis_data
